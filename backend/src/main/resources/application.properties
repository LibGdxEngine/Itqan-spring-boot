# Application
spring.application.name=itqan-edu-backend
server.port=8080

# Database Configuration
# These can be overridden by environment variables (SPRING_DATASOURCE_URL, etc.)
# For Docker: use postgres:5432 (service name)
# For local development: use localhost:5433
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/itqan_edu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:60000}
spring.datasource.hikari.pool-name=ItqanHikariPool

# Docker Compose Support (disabled - using manual configuration)
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

# JWT Configuration
jwt.secret=${JWT_SECRET:itqan-education-platform-secret-key-change-in-production-environment-minimum-256-bits}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
spring.web.cors.allowed-origins=${SPRING_WEB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=${SPRING_WEB_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
spring.web.cors.allowed-headers=${SPRING_WEB_CORS_ALLOWED_HEADERS:*}
spring.web.cors.allow-credentials=${SPRING_WEB_CORS_ALLOW_CREDENTIALS:true}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:}

# OTP Configuration
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:15}

# App Configuration
app.name=${APP_NAME:Itqan Education}
app.super-admin.email=${APP_SUPER_ADMIN_EMAIL:superadmin@itqan.edu}
app.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:Admin@123456}
app.super-admin.first-name=${APP_SUPER_ADMIN_FIRST_NAME:Super}
app.super-admin.last-name=${APP_SUPER_ADMIN_LAST_NAME:Admin}
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_dummy}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/courses/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/courses/cancel}
stripe.currency=${STRIPE_CURRENCY:usd}
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}
app.storage.s3.access-key=${APP_STORAGE_S3_ACCESS_KEY:minioadmin}
app.storage.s3.secret-key=${APP_STORAGE_S3_SECRET_KEY:minioadmin}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:itqan-videos}
app.storage.s3.path-style-access-enabled=${APP_STORAGE_S3_PATH_STYLE_ACCESS_ENABLED:true}
app.video.max-size-bytes=${APP_VIDEO_MAX_SIZE_BYTES:5368709120}
app.video.multipart.part-size-bytes=${APP_VIDEO_MULTIPART_PART_SIZE_BYTES:16777216}
app.video.presign-expiry-minutes=${APP_VIDEO_PRESIGN_EXPIRY_MINUTES:15}
app.video.playback-url-expiry-minutes=${APP_VIDEO_PLAYBACK_URL_EXPIRY_MINUTES:60}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL_MS:600000}
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=itqan:
spring.cache.redis.use-key-prefix=true

# Meilisearch Configuration
meili.host=${MEILI_HOST:http://localhost:7700}
meili.master-key=${MEILI_MASTER_KEY:masterKey123}

# Multipart limits (used for any server-side multipart endpoints)
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:6GB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:6GB}

# JPA Query Timeout (5 seconds for analytics queries)
spring.jpa.properties.jakarta.persistence.query.timeout=5000

# Account Lockout
security.account-lockout.max-attempts=${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
security.account-lockout.duration-minutes=${ACCOUNT_LOCKOUT_DURATION_MINUTES:15}

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Pagination Defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Logging - file-based JSON logging for production profile only
# See logback-spring.xml for configuration
logging.file.path=${LOG_PATH:./logs}
logging.level.com.itqan.edu=DEBUG
logging.level.org.springframework.security=DEBUG
