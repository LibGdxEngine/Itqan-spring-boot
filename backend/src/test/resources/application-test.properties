# Test Configuration
spring.application.name=itqan-edu-backend-test

# H2 Database Configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-minimum-256-bits-required
jwt.expiration=3600000

# OTP Configuration
otp.expiry-minutes=15

# App Configuration
app.name=Itqan Education Test
stripe.secret-key=sk_test_dummy
stripe.webhook-secret=whsec_dummy
stripe.success-url=http://localhost:3000/courses/success
stripe.cancel-url=http://localhost:3000/courses/cancel
stripe.currency=usd

# Google OAuth - disabled for tests (will be mocked)
google.client-id=test-client-id

# Email - disabled for tests (will be mocked)
spring.mail.host=localhost
spring.mail.port=25

# Cache - use in-memory cache for tests (no Redis required)
spring.cache.type=simple
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Logging
logging.level.com.itqan.edu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.testcontainers=INFO

# Rate limiting off in tests (many auth calls from one client); RateLimitFilterTest covers it
security.rate-limit.enabled=false

# Tests build the schema with Hibernate on H2; Flyway migrations are PostgreSQL-specific
spring.flyway.enabled=false

# Paymob test configuration (the gateway itself is mocked in tests).
paymob.enabled=true
paymob.secret-key=sk_test
paymob.public-key=pk_test
paymob.integration-ids=111
paymob.hmac-secret=test_hmac_secret
paymob.public-url=https://itqan.test

# EasyKash test configuration (the gateway itself is mocked in tests).
easykash.api-key=ek_test
easykash.hmac-secret=da9fe30575517d987762a859842b5631
easykash.public-url=https://itqan.test
