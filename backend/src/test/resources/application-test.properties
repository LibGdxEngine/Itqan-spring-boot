# Test Configuration
spring.application.name=itqan-edu-backend-test

# JPA Configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-minimum-256-bits-required
jwt.expiration=3600000

# OTP Configuration
otp.expiry-minutes=15

# App Configuration
app.name=Itqan Education Test

# Google OAuth - disabled for tests (will be mocked)
google.client-id=test-client-id

# Email - disabled for tests (will be mocked)
spring.mail.host=localhost
spring.mail.port=25

# Logging
logging.level.com.itqan.edu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.testcontainers=INFO
