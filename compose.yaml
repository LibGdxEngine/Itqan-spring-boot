# Docker Compose Configuration
# Switch between 'dev' and 'prod' modes using the COMPOSE_PROFILES environment variable in .env
# Example: COMPOSE_PROFILES=dev (Hot Reload) or COMPOSE_PROFILES=prod (Optimized)

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: ${RESTART_POLICY:-unless-stopped}
  networks:
    - itqan-network
  environment: &backend-env
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-itqan_edu}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_HIBERNATE_DDL_AUTO:-update}
    SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
    SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
    JWT_SECRET: ${JWT_SECRET:-itqan-education-platform-secret-key-change-in-production-environment-minimum-256-bits}
    JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
    JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
    APP_SUPER_ADMIN_EMAIL: ${APP_SUPER_ADMIN_EMAIL:-superadmin@itqan.edu}
    APP_SUPER_ADMIN_PASSWORD: ${APP_SUPER_ADMIN_PASSWORD:-Admin@123456}
    APP_SUPER_ADMIN_FIRST_NAME: ${APP_SUPER_ADMIN_FIRST_NAME:-Super}
    APP_SUPER_ADMIN_LAST_NAME: ${APP_SUPER_ADMIN_LAST_NAME:-Admin}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
    STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/courses/success}
    STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/courses/cancel}
    STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
    SPRING_WEB_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    SPRING_WEB_CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
    SPRING_WEB_CORS_ALLOWED_HEADERS: "Authorization,Content-Type,Accept,Origin,X-Requested-With,Cache-Control"
    SPRING_WEB_CORS_ALLOW_CREDENTIALS: "true"
    SPRING_DOCKER_COMPOSE_ENABLED: "false"
    APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-http://minio:9000}
    APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
    APP_STORAGE_S3_ACCESS_KEY: ${APP_STORAGE_S3_ACCESS_KEY:-minioadmin}
    APP_STORAGE_S3_SECRET_KEY: ${APP_STORAGE_S3_SECRET_KEY:-minioadmin}
    APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-itqan-videos}
    APP_STORAGE_S3_PATH_STYLE_ACCESS_ENABLED: "true"
    APP_VIDEO_MAX_SIZE_BYTES: ${APP_VIDEO_MAX_SIZE_BYTES:-5368709120}
    APP_VIDEO_MULTIPART_PART_SIZE_BYTES: ${APP_VIDEO_MULTIPART_PART_SIZE_BYTES:-16777216}
    APP_VIDEO_PRESIGN_EXPIRY_MINUTES: ${APP_VIDEO_PRESIGN_EXPIRY_MINUTES:-15}
    APP_VIDEO_PLAYBACK_URL_EXPIRY_MINUTES: ${APP_VIDEO_PLAYBACK_URL_EXPIRY_MINUTES:-60}
    MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
    MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
    RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-60}
    RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
    ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
    ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    meilisearch:
      condition: service_healthy
    redis:
      condition: service_healthy

x-frontend-base: &frontend-base
  build:
    context: ./frontend
    dockerfile: Dockerfile
  restart: ${RESTART_POLICY:-unless-stopped}
  networks:
    - itqan-network
  environment: &frontend-env
    NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: itqan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${PORT_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${PORT_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - itqan-network
    restart: ${RESTART_POLICY:-unless-stopped}

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: itqan-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILI_ENV: ${MEILI_ENV:-development}
    ports:
      - "${PORT_BIND_HOST:-127.0.0.1}:${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - itqan-network
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: itqan-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/${APP_STORAGE_S3_BUCKET:-itqan-videos};
      "
    networks:
      - itqan-network
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: itqan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itqan_edu}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${PORT_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itqan-network
    restart: ${RESTART_POLICY:-unless-stopped}

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itqan-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@itqan.edu}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PORT_BIND_HOST:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - itqan-network
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles:
      - pgadmin

  # ==========================================
  # DEVELOPMENT SERVICES (Profile: dev)
  # ==========================================

  backend:
    <<: *backend-base
    profiles: [dev]
    container_name: itqan-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "35729:35729"
    environment:
      <<: *backend-env
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_REMOTE_SECRET: "itqan-dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - maven_cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  frontend:
    <<: *frontend-base
    profiles: [dev]
    container_name: itqan-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/messages:/app/messages
    environment:
      <<: *frontend-env
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    command: npm run dev

  # ==========================================
  # PRODUCTION SERVICES (Profile: prod)
  # ==========================================

  backend-prod:
    <<: *backend-base
    profiles: [prod]
    container_name: itqan-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend-prod:
    <<: *frontend-base
    profiles: [prod]
    container_name: itqan-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      <<: *frontend-env
      NODE_ENV: production
    depends_on:
      - backend-prod

  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: itqan-caddy
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - backend-prod
      - frontend-prod
    networks:
      - itqan-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: itqan-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${PORT_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - itqan-network
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: postgres:16-alpine
    container_name: itqan-postgres-backup
    # Opt-in only: cron inside an alpine container has setpgid issues on some hosts.
    # Enable with: COMPOSE_PROFILES=prod,backup
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-itqan_edu}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - backup_data:/backups
    networks:
      - itqan-network
    entrypoint: /bin/sh
    command: -c "apk add --no-cache dcron && echo '0 2 * * * /usr/local/bin/db-backup.sh' | crontab - && crond -f -l 2"
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  postgres_data:
  pgadmin_data:
  maven_cache:
  minio_data:
  meili_data:
  caddy_data:
  caddy_config:
  redis_data:
  backup_data:

networks:
  itqan-network:
    name: itqan-network
