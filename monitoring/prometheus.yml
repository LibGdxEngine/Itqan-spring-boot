# Template: the prometheus service in compose.yaml renders it to /tmp/prometheus.yml
# (it substitutes __METRICS_TARGET__ and writes the scrape token to a file first).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: itqan-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /tmp/secrets/scrape-token
    static_configs:
      - targets: ["__METRICS_TARGET__"]
